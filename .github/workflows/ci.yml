name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: identitytrace
          POSTGRES_USER: identitytrace
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U identitytrace" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Detection, correlation, AI guardrail and API tests (SQLite)
        run: pytest
      - name: API tests against PostgreSQL
        run: pytest tests/test_api.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://identitytrace:ci-only@localhost:5432/identitytrace
      - name: Synthetic dataset is reproducible
        run: |
          python examples/generate_synthetic.py
          git diff --exit-code examples/
      - name: Benchmark
        run: |
          python -m benchmark.run --markdown benchmark-results.md
          cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            benchmark/results.json
            benchmark-results.md

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
